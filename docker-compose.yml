services:
  # Backend: FastAPI dashboard/API runtime
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: agentic-seller-backend
    ports:
      - "8000:8000"
    environment:
      # AWS runs only the dashboard/API and product-data management.
      # Listing generation and publishing run from a local PC.
      - SESSION_TTL_DAYS=${SESSION_TTL_DAYS:-30}
      - PENDING_RETENTION_DAYS=${PENDING_RETENTION_DAYS:-90}
      - READY_RETENTION_DAYS=${READY_RETENTION_DAYS:-30}
      - RETENTION_CHECK_HOURS=${RETENTION_CHECK_HOURS:-24}
      - DAILY_BACKUP_ENABLED=${DAILY_BACKUP_ENABLED:-false}
      - DAILY_BACKUP_HOUR_UTC=${DAILY_BACKUP_HOUR_UTC:-3}
      - MAX_BACKUP_EMAIL_MB=${MAX_BACKUP_EMAIL_MB:-20}
      - ADMIN_BACKUP_EMAIL=${ADMIN_BACKUP_EMAIL:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM_EMAIL=${SMTP_FROM_EMAIL:-}
      - SMTP_USE_TLS=${SMTP_USE_TLS:-true}
    volumes:
      # Persistent volume for product data, auth/session state, and review metadata.
      - agentic_data:/app/data
    networks:
      - agentic-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Frontend: Streamlit dashboard
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: agentic-seller-frontend
    ports:
      - "8501:8501"
    environment:
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_LOGGER_LEVEL=warning
      - SESSION_TTL_DAYS=${SESSION_TTL_DAYS:-30}
      - SESSION_COOKIE_SECURE=${SESSION_COOKIE_SECURE:-false}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - agentic-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  # Persistent volume for uploaded products, approved products, auth, and review metadata.
  agentic_data:
    driver: local

networks:
  agentic-network:
    driver: bridge
